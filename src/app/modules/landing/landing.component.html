<div class="surface-0 flex justify-content-center">
  <div id="home" class="landing-wrapper overflow-hidden">
    <div class="flex-grow-1 flex flex-column align-items-center justify-content-center min-vh100">
      <div class="text-center  ">
        <div class="digital-clock-container mb-4">
          <div class="date-display text-2xl font-medium text-900 mb-3">{{ currentDate }}</div>
          <div class="time-display text-6xl md:text-7xl font-bold text-blue-600 mb-4">{{ currentTime }}</div>
        </div>
         <button pButton pRipple label="Login" (click)="navigateToLogin()"
          class="p-button-raised p-button-rounded text-xl border-none  text-white px-4 py-3">
        </button>
      </div>
    </div>
  </div>
</div>
